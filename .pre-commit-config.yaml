# Код репозитория публичный (ADR-019), поэтому секрет ловится ДО коммита:
# попавший в историю лечится отзывом и перевыпуском, а не переписыванием
# истории. GitHub push protection - вторая линия, не первая.
#
# Хук берётся образом, а не сборкой из исходников: официальный gitleaks-хук
# требует установленного Go, а Docker на этой машине нужен и без него.
# Версия запинена намеренно - "latest" в проверке секретов означает, что
# набор правил меняется под ногами.

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (проверка staged-изменений)
        language: docker_image
        entry: zricethezav/gitleaks:v8.18.4 protect --staged --redact --verbose
        pass_filenames: false
