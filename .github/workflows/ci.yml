# CI - единственное место, где mypy --strict гарантированно исполняется:
# на машине owner Store-сборка Python ломает нативное расширение mypy
# (см. docs/BUILD-PROGRESS.md). Здесь Linux, здесь он работает.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: lint + tests
    runs-on: ubuntu-latest

    # Тесты схемы гоняются против настоящей Postgres. SQLite не подошёл бы:
    # проверяются timestamptz, jsonb, bytea, частичный уникальный индекс и
    # каскад - то, чего у него либо нет, либо оно ведёт себя иначе.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jarvis_test
          POSTGRES_USER: jarvis
          # Эфемерная база сборочного агента; секретом это значение быть
          # не может и не является.
          POSTGRES_PASSWORD: jarvis-test-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # venv, а не системный python: так CI повторяет ровно тот путь,
      # которым запускается разработка у owner, вместе с путями в Makefile.
      - name: Создать venv и поставить зависимости
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install --upgrade pip
          apps/api/.venv/bin/python -m pip install -e "apps/api[dev]"

      - name: Линтеры и типы
        run: make lint

      - name: Тесты
        # Без этой переменной тесты схемы пропускаются, и прогон выглядит
        # зелёным, ничего не проверив. В CI она задана всегда - именно
        # здесь эти тесты обязаны выполняться.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://jarvis:jarvis-test-not-a-secret@127.0.0.1:5432/jarvis_test
        run: make test

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Валидация без запуска: проверяется синтаксис и подстановка переменных.
      # Значения фиктивные - они обязательны только потому, что compose
      # намеренно не даёт ни базе дефолтного пароля, ни туннелю дефолтного
      # токена. Реальные лежат в .env на Pi и в CI недоступны.
      - name: Проверить compose
        env:
          POSTGRES_PASSWORD: ci-dummy-not-a-secret
          # CF_TUNNEL_TOKEN намеренно НЕ задан: overlay обязан читаться без
          # него, иначе на Pi ломаются команды, туннеля не касающиеся.
          # Эта проверка и ловит возврат обязательной переменной.
        # Overlay проверяется отдельной строкой, а не вместе с базой: он
        # применяется только на Pi, то есть там, где отладка дороже всего.
        run: |
          docker compose -f infra/docker-compose.yml config --quiet
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.pi.yml config --quiet
          docker compose --env-file infra/dev.env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml config --quiet
