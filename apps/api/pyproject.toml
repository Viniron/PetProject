# Один файл на всё: зависимости, ruff, black, mypy, pytest.
# Причина — CLAUDE.md требует ruff + black + mypy --strict + pytest, и держать
# их настройки в четырёх разных файлах не за что.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-api"
version = "0.1.0"
description = "JARVIS - персональный ассистент owner: API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # httpx2, а не httpx: starlette.testclient со старым httpx выводит
    # deprecation в каждом прогоне, и он бы шумел в отчётах всё время.
    "httpx2>=2.12",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.setuptools]
# Раскладка плоская: рядом с пакетом лежит tests/, и автообнаружение
# setuptools на двух корневых пакетах отказывается угадывать.
packages = ["jarvis_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# DTZ здесь не украшение: он превращает инвариант 7 (нет наивных datetime)
# из пункта ревью в ошибку линтера. T20 ловит print в сервисном коде.
select = ["E", "F", "W", "I", "UP", "B", "DTZ", "ASYNC", "T20"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Тесты проверяются так же строго, как код: непроверенный тест ничего не гарантирует.
files = ["jarvis_api", "tests"]
# Страховка на случай запуска по каталогу: в venv лежат чужие пакеты,
# и проверять их --strict бессмысленно и очень долго.
exclude = ['\.venv']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
