# Один файл на всё: зависимости, ruff, black, mypy, pytest.
# Причина — CLAUDE.md требует ruff + black + mypy --strict + pytest, и держать
# их настройки в четырёх разных файлах не за что.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-api"
version = "0.1.0"
description = "JARVIS - персональный ассистент owner: API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # Схема живёт в моделях, миграции сверяются с ними (`alembic check`).
    # Без общей metadata autogenerate невозможен, и расхождение модели
    # с базой ловилось бы только глазами.
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    # Драйвер тот же, что в DATABASE_URL из compose: postgresql+psycopg.
    # binary - готовое колесо, чтобы образ не тянул компилятор ради libpq;
    # для arm64 Pi такое колесо публикуется.
    "psycopg[binary]>=3.2,<4",
    # Э3. Переехал из dev-зависимостей, новой библиотеки в проекте не появилось.
    # Нужен не «чтобы ходить по HTTP» - для этого хватало urllib, на нём написан
    # клиент B2. Нужен ровно ради входа в ИСУ: это Authorization Code + PKCE
    # с эмуляцией формы Keycloak, то есть куки между четырьмя запросами,
    # запрет следования редиректу и вылавливание code из Location. На urllib
    # это cookiejar плюс свой redirect-handler - полсотни строк велосипеда
    # в самом хрупком месте этапа.
    "httpx2>=2.12",
    # Э3. Единственная действительно новая зависимость. Пароль ИСУ лежит
    # в базе шифротекстом (CLAUDE.md), а дампы уезжают в B2 нешифрованными
    # (ADR-020) - без шифра утёкший бэкап отдаёт пароль. Шифра в stdlib нет,
    # заменить нечем. Колесо под linux/arm64 публикуется, компилятор в образ
    # не тянется.
    "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # httpx2 переехал в основные зависимости на Э3 - здесь его больше нет,
    # но starlette.testclient по-прежнему берёт именно его: httpx2, а не httpx,
    # потому что со старым httpx он выводит deprecation в каждом прогоне.
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.setuptools]
# Раскладка плоская: рядом с пакетом лежит tests/, и автообнаружение
# setuptools на двух корневых пакетах отказывается угадывать.
# Подпакеты перечислены явно по той же причине: без них образ соберётся,
# но упадёт на импорте jarvis_api.jobs уже в контейнере.
packages = [
    "jarvis_api",
    "jarvis_api.db",
    "jarvis_api.integrations",
    "jarvis_api.integrations.itmo",
    "jarvis_api.jobs",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# DTZ здесь не украшение: он превращает инвариант 7 (нет наивных datetime)
# из пункта ревью в ошибку линтера. T20 ловит print в сервисном коде.
select = ["E", "F", "W", "I", "UP", "B", "DTZ", "ASYNC", "T20"]

[tool.ruff.lint.isort]
# В репозитории есть каталог apps/api/alembic, из-за которого ruff принимает
# библиотеку alembic за локальный пакет и уносит её импорты в чужую группу.
known-third-party = ["alembic"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Каталог alembic/ не пакет и не лежит в sys.path, поэтому импорт jarvis_api
# из env.py mypy иначе не находит. Путь относительно этого файла.
mypy_path = "$MYPY_CONFIG_FILE_DIR"
# Тесты проверяются так же строго, как код: непроверенный тест ничего не гарантирует.
files = ["jarvis_api", "tests"]
# Страховка на случай запуска по каталогу: в venv лежат чужие пакеты,
# и проверять их --strict бессмысленно и очень долго.
exclude = ['\.venv']

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra показывает причины пропусков. Без него пропущенные тесты базы
# выглядят как зелёный прогон, хотя ничего не проверили.
addopts = "-q -ra"
