# Один файл на всё: зависимости, ruff, black, mypy, pytest.
# Причина — CLAUDE.md требует ruff + black + mypy --strict + pytest, и держать
# их настройки в четырёх разных файлах не за что.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-api"
version = "0.1.0"
description = "JARVIS - персональный ассистент owner: API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # Схема живёт в моделях, миграции сверяются с ними (`alembic check`).
    # Без общей metadata autogenerate невозможен, и расхождение модели
    # с базой ловилось бы только глазами.
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    # Драйвер тот же, что в DATABASE_URL из compose: postgresql+psycopg.
    # binary - готовое колесо, чтобы образ не тянул компилятор ради libpq;
    # для arm64 Pi такое колесо публикуется.
    "psycopg[binary]>=3.2,<4",
    # Э3. Переехал из dev-зависимостей, новой библиотеки в проекте не появилось.
    # Нужен не «чтобы ходить по HTTP» - для этого хватало urllib, на нём написан
    # клиент B2. Нужен ровно ради входа в ИСУ: это Authorization Code + PKCE
    # с эмуляцией формы Keycloak, то есть куки между четырьмя запросами,
    # запрет следования редиректу и вылавливание code из Location. На urllib
    # это cookiejar плюс свой redirect-handler - полсотни строк велосипеда
    # в самом хрупком месте этапа.
    "httpx2>=2.12",
    # Э3. Единственная действительно новая зависимость. Пароль ИСУ лежит
    # в базе шифротекстом (CLAUDE.md), а дампы уезжают в B2 нешифрованными
    # (ADR-020) - без шифра утёкший бэкап отдаёт пароль. Шифра в stdlib нет,
    # заменить нечем. Колесо под linux/arm64 публикуется, компилятор в образ
    # не тянется.
    "cryptography>=44,<47",
    # Э4. Официальный SDK Google - выбор owner (ADR-026), а не следствие
    # необходимости: пяти вызовов REST и подписи JWT хватило бы на httpx2
    # с уже имеющейся cryptography. Взамен получаем discovery-описание
    # календаря в самом пакете (static_discovery), повторы с backoff внутри
    # execute() и штатные подставные транспорты для тестов.
    #
    # Три пакета, а не один: google-auth даёт учётные данные service account,
    # google-auth-httplib2 - обёртку AuthorizedHttp, единственное место, где
    # внешнему вызову задаётся таймаут (CLAUDE.md требует его на каждом,
    # а умолчание httplib2 - без ограничения).
    #
    # Цена решения названа прямо: следом приезжают google-api-core, requests,
    # protobuf, proto-plus, googleapis-common-protos и opentelemetry-api -
    # то есть три строки здесь превращаются в дюжину пакетов в образе.
    # Проверено, а не предположено: колёса под linux/arm64 публикуются для
    # всех, включая protobuf, поэтому компилятор на плате по-прежнему не нужен.
    "google-api-python-client>=2.180,<3",
    "google-auth>=2.35,<3",
    "google-auth-httplib2>=0.2,<0.3",
    # Э5. Планировщик назван в таблице стека CLAUDE.md, но зависимость всё
    # равно новая, и owner её подтвердил отдельно. Ветка 3.x, а не 4.x:
    # четвёртая до сих пор в альфе (4.0.0aN) и переписана async-first -
    # то есть несовместима по именам и ставить её значило бы жить
    # на предрелизе в единственном месте, которое обязано работать без
    # присмотра. Цена: следом приезжает tzlocal - чистый Python, колесо
    # py3-none-any, компилятор на плате не нужен. Знать про неё надо ради
    # другого: tzlocal подставляет зону контейнера (UTC), если забыть
    # передать timezone явно, и расписание молча уезжает на три часа.
    "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # httpx2 переехал в основные зависимости на Э3 - здесь его больше нет,
    # но starlette.testclient по-прежнему берёт именно его: httpx2, а не httpx,
    # потому что со старым httpx он выводит deprecation в каждом прогоне.
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pre-commit>=4.0",
    # Э4. У google-api-python-client нет py.typed, и mypy --strict падает на
    # импорте раньше, чем доходит до нашего кода. Стабы сообществом ведутся
    # активно и версионируются вслед за SDK; альтернатива - ignore_missing_imports,
    # то есть отказ от проверки типов ровно в том месте, где мы работаем
    # с чужим API по строковым ключам.
    "google-api-python-client-stubs>=1.29,<2",
]

[tool.setuptools]
# Раскладка плоская: рядом с пакетом лежит tests/, и автообнаружение
# setuptools на двух корневых пакетах отказывается угадывать.
# Подпакеты перечислены явно по той же причине: без них образ соберётся,
# но упадёт на импорте jarvis_api.jobs уже в контейнере.
packages = [
    "jarvis_api",
    "jarvis_api.db",
    "jarvis_api.integrations",
    "jarvis_api.integrations.itmo",
    "jarvis_api.integrations.gcal",
    "jarvis_api.jobs",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# DTZ здесь не украшение: он превращает инвариант 7 (нет наивных datetime)
# из пункта ревью в ошибку линтера. T20 ловит print в сервисном коде.
select = ["E", "F", "W", "I", "UP", "B", "DTZ", "ASYNC", "T20"]

[tool.ruff.lint.isort]
# В репозитории есть каталог apps/api/alembic, из-за которого ruff принимает
# библиотеку alembic за локальный пакет и уносит её импорты в чужую группу.
known-third-party = ["alembic"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Каталог alembic/ не пакет и не лежит в sys.path, поэтому импорт jarvis_api
# из env.py mypy иначе не находит. Путь относительно этого файла.
mypy_path = "$MYPY_CONFIG_FILE_DIR"
# Тесты проверяются так же строго, как код: непроверенный тест ничего не гарантирует.
files = ["jarvis_api", "tests"]
# Страховка на случай запуска по каталогу: в venv лежат чужие пакеты,
# и проверять их --strict бессмысленно и очень долго.
exclude = ['\.venv']

# Единственное исключение из --strict, и оно узкое: у `google-auth-httplib2`
# нет ни py.typed, ни стабов в природе (`google-auth-httplib2-stubs` не
# существует, проверено). Пакет из трёх функций, и используется из него
# одна - обёртка AuthorizedHttp. Глобального ignore_missing_imports
# при этом нет: он погасил бы проверку и там, где типы есть.
[[tool.mypy.overrides]]
module = ["google_auth_httplib2"]
ignore_missing_imports = true

# Э5. У APScheduler 3.x нет py.typed, и стабов не существует: types-APScheduler
# в typeshed нет, а apscheduler-stubs на PyPI - пустышка без содержимого
# ("Add your description here"), то есть чужой пакет в зависимостях проекта,
# где в базе лежит пароль ИСУ. Поэтому - точечный игнор по прецеденту
# google_auth_httplib2. Следствие: модуль становится Any, и опечатку в имени
# метода mypy не поймает. Отсюда правило: всё общение с APScheduler заперто
# в jarvis_api/scheduler.py, наружу выходят только типизированные функции.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra показывает причины пропусков. Без него пропущенные тесты базы
# выглядят как зелёный прогон, хотя ничего не проверили.
addopts = "-q -ra"
