# ASCII only. Alembic reads this file with encoding="locale": on Windows that
# is cp1251, and a UTF-8 comment in Russian crashes the CLI before it starts.
# Comments in Russian live in alembic/env.py, which Python reads as UTF-8.
#
# No connection string here on purpose - the URL comes from the environment
# (host invariant 2) and is assembled in env.py. This file is public.

[alembic]
# %(here)s is the directory of this file: the CLI then works from any cwd,
# which is what `make migrate` from the repo root needs.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# Explicit separator; without it Alembic warns and falls back to legacy
# splitting on spaces, commas and colons - which breaks Windows paths.
path_separator = os
# Revision files are named by date first, so that the order on disk matches
# the order of application without reading down_revision.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# UTC, like every other timestamp in this project (invariant 7).
timezone = UTC
