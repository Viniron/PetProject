# Один compose на все окружения (инвариант хоста 4): различия - в env
# и overlay-файлах, а не в копии этого файла.
#
# На Э0 здесь два сервиса и ни одной строки про туннель: cloudflared
# добавляется на Э1 вместе с самим хостом.

# Имя проекта задаётся явно: иначе compose берёт его из имени каталога
# и контейнеры называются infra-api-1. На Pi это же имя - в командах
# восстановления и в логах, гадать по нему не должно приходиться.
name: jarvis

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      # Без дефолта намеренно: дефолтный пароль базы - это отсутствие пароля.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # Единственное состояние сервиса живёт здесь (инвариант хоста 1):
      # всё, что нужно восстановить, достаётся из pg_dump этой базы.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    environment:
      ENV: ${ENV:-prod}
      # Строка собирается из POSTGRES_*, чтобы пароль базы существовал в одном
      # месте: две независимые копии расходятся ровно в день смены пароля.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-jarvis}
      # Учётные данные ИСУ (Э3). Пустые значения допустимы - тот же приём,
      # что у сервиса backup с B2_*: без них API поднимается и отвечает,
      # а джоб забора расписания отказывается работать с внятным текстом.
      #
      # Требовать их через ${...:?} нельзя по двум причинам. Стек на чистой
      # плате обязан подняться до того, как owner заведёт учётные данные,
      # иначе Э1 нельзя было бы закрыть раньше Э3. И сообщение compose о
      # недостающей переменной хуже нашего: оно не говорит, где её взять.
      ISU_LOGIN: ${ISU_LOGIN:-}
      ISU_PASSWORD: ${ISU_PASSWORD:-}
      ISU_CRED_KEY: ${ISU_CRED_KEY:-}
      # Google Calendar (Э4), по тому же правилу пустого умолчания.
      # Строка здесь не формальность: на Э3 переменные были и в config.py,
      # и в .env, и в тестах - но не в этом блоке, и первый живой прогон
      # на плате упал именно на этом. Класс ошибки закрыт tests/test_compose_env.py.
      GOOGLE_SA_JSON: ${GOOGLE_SA_JSON:-}
      GOOGLE_CALENDAR_OWNER_EMAIL: ${GOOGLE_CALENDAR_OWNER_EMAIL:-}
      # Планировщик (Э5). Пустое умолчание здесь такое же, как у секретов,
      # хотя это не секреты, а настройки: формат один на все переменные,
      # и проверяет его tests/test_compose_env.py. Пустое значение конфиг
      # понимает как «умолчание» - без этого пустая строка на bool и int
      # роняла бы процесс на импорте, до всякого /health.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-}
      SCHEDULER_DAILY_TIMES: ${SCHEDULER_DAILY_TIMES:-}
      SCHEDULER_CATCHUP_COOLDOWN_MINUTES: ${SCHEDULER_CATCHUP_COOLDOWN_MINUTES:-}
      SCHEDULER_MISFIRE_GRACE_SECONDS: ${SCHEDULER_MISFIRE_GRACE_SECONDS:-}
      # API календаря (Э6), тот же формат пустого умолчания. Порог давности
      # завязан на SCHEDULER_DAILY_TIMES: прореживание расписания требует
      # поднять и его, иначе экран красит полосой каждое утро. Таймауты базы
      # держат обещание §10 «деградация, а не вечный спиннер».
      CALENDAR_STALE_AFTER_HOURS: ${CALENDAR_STALE_AFTER_HOURS:-}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-}
      # Аутентификация owner (Э7, ADR-033). Формат пустого умолчания тот же,
      # но следствие у пустоты здесь противоположное: джоб без ISU_* просто
      # не работает, а API без CF_ACCESS_* отказывает на каждом /api/* -
      # пока ENV не dev. Это не строгость ради строгости: забытая строчка
      # в .env под включённым туннелем означала бы публичный доступ
      # к расписанию, то есть ошибку ценой в одну переменную.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_ALLOWED_EMAIL: ${CF_ACCESS_ALLOWED_EMAIL:-}
      # Второй маршрут туннеля (Э9б, ADR-045). Читает её только
      # `make tunnel-check-pi`, а он выполняется внутри этого контейнера:
      # без проброски проверка ssh-маршрута молча превращается в SKIP,
      # то есть ровно в ту тишину, ради которой она заведена.
      CF_ACCESS_SSH_HOSTNAME: ${CF_ACCESS_SSH_HOSTNAME:-}
      # Слой моделей (Э12а). Назначение и потолок расходов - настройки,
      # а не секреты, но формат тот же: пустое значение означает «умолчание»,
      # и на int с Decimal пустая строка иначе роняла бы Settings на импорте.
      # Пустой LLM_ROUTING - рабочее состояние: ни одна задача не назначена.
      LLM_ROUTING: ${LLM_ROUTING:-}
      LLM_MONTHLY_CAP_USD: ${LLM_MONTHLY_CAP_USD:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
      LLM_SCHEMA_RETRIES: ${LLM_SCHEMA_RETRIES:-}
      # Э12б. Пустой ключ - провайдер не подключён: маршрут на него
      # отказывает с перечислением подключённых, а не ходит в никуда.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_RETRIES: ${LLM_RETRIES:-}
      LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-}
      # Захват событий (Э8), тот же формат пустого умолчания. Срок жизни
      # черновика - это ещё и срок, на который сырьё захвата остаётся
      # в ночных дампах, а таймаут держит обещание §10: подтверждение
      # не ждёт Google дольше нескольких секунд.
      CAPTURE_DRAFT_TTL_HOURS: ${CAPTURE_DRAFT_TTL_HOURS:-}
      CAPTURE_TEXT_MAX_CHARS: ${CAPTURE_TEXT_MAX_CHARS:-}
      CAPTURE_PUSH_TIMEOUT_SECONDS: ${CAPTURE_PUSH_TIMEOUT_SECONDS:-}
      # Живучесть (Э9, ADR-043). Адрес стороннего сторожа, которому цепочка
      # календаря сообщает об удачном прогоне. Забытая строчка здесь тише
      # всех прочих: стек работает, расписание доезжает, и молчит только
      # наблюдатель - то есть пропажа обнаружится ровно тогда, когда
      # перестанет доезжать расписание, и узнать об этом будет нечем.
      JOBS_HEARTBEAT_URL: ${JOBS_HEARTBEAT_URL:-}
      # Разбор книжки (Ф4а), тот же формат. Окно поиска второго конца перевода
      # себе: настоящих выгрузок второго банка ещё нет, и подгонять его
      # придётся по первым же живым данным - строкой в .env, а не пересборкой.
      FINANCE_TRANSFER_WINDOW_DAYS: ${FINANCE_TRANSFER_WINDOW_DAYS:-}
      # Давность книжки (Ф6), тот же формат. Забытая проброска не ломает
      # ничего видимого: плашка просто зажигается по умолчанию из config.py,
      # а не по сроку, который owner вписал в .env.
      FINANCE_STALE_AFTER_DAYS: ${FINANCE_STALE_AFTER_DAYS:-}
    # Запас на остановку. Планировщик останавливается без ожидания текущего
    # прогона, но рабочие потоки интерпретатор джойнит на выходе, а прогон -
    # это десятки записей в чужой календарь. Умолчания в 10 секунд не хватает,
    # и docker присылает SIGKILL посреди работы. Потеря при обрыве - максимум
    # одно событие: push_gcal коммитит после каждого.
    stop_grace_period: 30s
    ports:
      # Только на loopback: наружу сервис выставляется Cloudflare Tunnel (Э1),
      # порты на роутере не открываются (ADR-017).
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Тем же /health, которым проверяется живость снаружи. Базу он не
      # трогает, поэтому меряет именно контейнер, а не доступность Postgres.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Фронт (Э7): статика Next и он же - единственная дверь к API снаружи.
  # Прокси здесь не удобство, а условие: фронт и API обязаны быть на одном
  # источнике, иначе понадобится CORS, которого в API нет намеренно
  # (ADR-031 п. 3). Своих переменных у сервиса нет - вся правда
  # в infra/Caddyfile, а собранная статика уже лежит в образе.
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    ports:
      # Только на loopback, как и api: наружу выходит Cloudflare Tunnel,
      # порты на роутере не открываются (ADR-017).
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Проверяется сам Caddy, а не API за ним: иначе падение API
      # выглядело бы падением фронта, и compose перезапускал бы не то.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
